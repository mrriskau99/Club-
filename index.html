<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  background:transparent;
  font-family:Georgia, "Times New Roman", serif;
  overflow:hidden;
}

/* ================= MAIN WIDGET ================= */

.widget{
  width:100%;
  padding:12px;
  border-radius:20px;

  background:
    linear-gradient(160deg,#24170d 0%,#3b2816 25%,#15110d 65%,#0b0b0b 100%);

  border:1px solid rgba(212,170,102,0.30);

  box-shadow:
    0 10px 24px rgba(0,0,0,0.38),
    0 0 16px rgba(212,170,102,0.08),
    inset 0 0 16px rgba(255,220,150,0.025);

  backdrop-filter:blur(10px);

  position:relative;
  overflow:hidden;
}

/* subtle ambient glow */

.widget::before{
  content:"";
  position:absolute;

  top:-70px;
  left:50%;
  transform:translateX(-50%);

  width:180px;
  height:180px;

  background:
    radial-gradient(circle,
    rgba(212,170,102,0.12),
    transparent 72%);

  pointer-events:none;
}

/* ================= HEADER ================= */

.header{
  position:relative;

  text-align:center;

  margin-bottom:10px;

  padding:11px 10px 9px;

  border-radius:15px;

  background:
    linear-gradient(180deg,
    rgba(255,255,255,0.02),
    rgba(255,255,255,0)),

    linear-gradient(145deg,#5d3d20,#1a120c);

  border:1px solid rgba(224,184,109,0.18);

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.04),
    0 5px 14px rgba(0,0,0,0.28),
    0 0 10px rgba(224,184,109,0.06);
}

.title{
  font-size:12px;
  letter-spacing:3px;
  font-weight:800;

  color:#ffe6b8;

  text-transform:uppercase;

  text-shadow:
    0 0 8px rgba(224,184,109,0.45),
    0 0 16px rgba(224,184,109,0.16);

  margin-bottom:4px;
}

.subtitle{
  font-size:9px;

  color:#d7b27a;

  opacity:.9;

  letter-spacing:.4px;

  line-height:1.3;
}

/* ================= MEMBER CARD ================= */

.card{
  position:relative;

  overflow:hidden;

  display:flex;
  align-items:center;
  gap:10px;

  padding:10px 11px;

  margin:6px 0;

  border-radius:15px;

  cursor:pointer;

  transform-origin:center;

  -webkit-tap-highlight-color:transparent;

  background:
    linear-gradient(180deg,
    rgba(255,255,255,0.02),
    rgba(255,255,255,0)),

    linear-gradient(145deg,#5d3d20,#1a120c);

  border:1px solid rgba(224,184,109,0.15);

  color:#f4dfb6;

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.04),
    0 5px 12px rgba(0,0,0,0.30);

  transition:
    transform .35s cubic-bezier(0.22,1,0.36,1),
    box-shadow .35s cubic-bezier(0.22,1,0.36,1),
    border-color .3s ease,
    filter .3s ease;
}

/* hover glow */

.card::before{
  content:"";

  position:absolute;
  inset:0;

  border-radius:inherit;

  pointer-events:none;

  background:
    radial-gradient(circle at top center,
    rgba(224,184,109,0.10),
    transparent 65%);

  opacity:0;

  transition:opacity .35s ease;
}

.card:hover{
  transform:translateY(-3px);

  box-shadow:
    0 10px 20px rgba(0,0,0,0.38),
    0 0 14px rgba(224,184,109,0.14);

  border-color:rgba(224,184,109,0.28);

  filter:brightness(1.03);
}

.card:hover::before{
  opacity:1;
}

.card:active{
  transform:translateY(-1px) scale(0.98);

  transition:
    transform .12s ease,
    box-shadow .12s ease;
}

/* ================= AVATAR ================= */

.avatar-wrap{
  position:relative;
  flex:0 0 auto;

  transition:
    transform .35s cubic-bezier(0.22,1,0.36,1);
}

.avatar{
  display:block;

  width:42px;
  height:42px;

  border-radius:50%;

  border:2px solid rgba(224,184,109,0.34);

  object-fit:cover;
  object-position:center;

  background:
    linear-gradient(145deg,#2d1d10,#100b07);

  box-shadow:
    0 0 0 3px rgba(224,184,109,0.05),
    0 5px 12px rgba(0,0,0,0.24);

  transition:
    transform .35s cubic-bezier(0.22,1,0.36,1),
    box-shadow .35s ease,
    border-color .3s ease;
}

.card:hover .avatar{
  transform:scale(1.03);

  border-color:rgba(255,222,170,0.72);

  box-shadow:
    0 0 0 4px rgba(224,184,109,0.06),
    0 0 12px rgba(224,184,109,0.14),
    0 6px 14px rgba(0,0,0,0.28);
}

/* ================= STATUS ================= */

.status{
  position:absolute;

  width:8px;
  height:8px;

  border-radius:50%;

  bottom:2px;
  right:2px;

  z-index:2;

  box-shadow:0 0 0 2px #120d08;
}

.online{
  background:#d6a860;

  box-shadow:
    0 0 0 2px #120d08,
    0 0 7px rgba(224,184,109,0.55);
}

.offline{
  background:#5b4a36;
}

/* ================= BADGE ================= */

.badge{
  position:absolute;

  top:7px;
  right:8px;

  font-size:8px;

  padding:3px 6px;

  border-radius:999px;

  background:
    linear-gradient(135deg,#d6a860,#fff0c7);

  color:#2a1808;

  font-weight:bold;

  letter-spacing:1px;

  box-shadow:
    0 0 8px rgba(224,184,109,0.22),
    0 4px 8px rgba(0,0,0,0.14);

  animation:badgeFade 6s forwards;
}

@keyframes badgeFade{
  0%{
    opacity:1;
    transform:translateY(0);
  }

  70%{
    opacity:1;
    transform:translateY(0);
  }

  100%{
    opacity:0;
    transform:translateY(-3px);
  }
}

/* ================= TEXT ================= */

.info{
  min-width:0;
  flex:1;
}

.name{
  font-size:11px;

  font-weight:650;

  letter-spacing:.2px;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;

  color:#ffe6b8;
}

.rating{
  font-size:9px;

  opacity:.82;

  margin-top:1px;

  color:#d7b27a;
}

.time{
  font-size:8px;

  opacity:.6;

  margin-top:1px;

  color:#c29b64;
}

/* ================= ENTRY ANIMATION ================= */

.fade{
  opacity:0;

  transform:translateY(10px);

  animation:
    reveal .55s cubic-bezier(0.22,1,0.36,1) forwards;
}

@keyframes reveal{
  to{
    opacity:1;
    transform:translateY(0);
  }
}
</style>

<div class="widget">

  <div class="header">
    <div class="title">♔ N.K.T. FRESH FACES ♔</div>

    <div class="subtitle">
      Welcoming the newest additions to the toli ✦
    </div>
  </div>

  <div id="members"></div>

</div>

<script>
const CLUB = "nashediyon-ki-toli-nkt";

let prevUsers = [];

async function fetchJSON(url){
  const res = await fetch(url);
  return res.json();
}

function getBest(stats){

  const map = {
    chess_rapid:"Rapid",
    chess_blitz:"Blitz",
    chess_bullet:"Bullet"
  };

  let best = null;

  for(const key in map){

    const rating = stats?.[key]?.last?.rating;

    if(rating && (!best || rating > best.r)){

      best = {
        t:map[key],
        r:rating
      };
    }
  }

  return best
    ? `${best.t}: ${best.r}`
    : "Unrated";
}

function timeAgo(ts){

  const diff =
    Math.floor((Date.now()/1000) - ts);

  if(diff < 60)
    return diff + "s ago";

  if(diff < 3600)
    return Math.floor(diff/60) + "m ago";

  if(diff < 86400)
    return Math.floor(diff/3600) + "h ago";

  return Math.floor(diff/86400) + "d ago";
}

function avatarHTML(src, username){

  const safeSrc =
    src && src.trim()
    ? src
    : "https://images.chesscomfiles.com/uploads/v1/user/default_avatar.192.gif";

  return `
    <img
      class="avatar"
      src="${safeSrc}"
      alt="${username}'s avatar"
      loading="lazy"
      referrerpolicy="no-referrer"
    >
  `;
}

function memberCard(user, delay = 0){

  return `
    <div
      class="card fade"
      style="animation-delay:${delay}s"
      onclick="window.open('https://www.chess.com/member/${user.u}','_blank')"
    >

      <div class="badge">FRESH</div>

      <div class="avatar-wrap">

        ${avatarHTML(user.a, user.u)}

        <div class="status ${user.on ? 'online' : 'offline'}"></div>

      </div>

      <div class="info">

        <div class="name">
          @${user.u}
        </div>

        <div class="rating">
          ${user.r}
        </div>

        <div class="time">
          ${timeAgo(user.j)}
        </div>

      </div>

    </div>
  `;
}

async function load(){

  try{

    const club =
      await fetchJSON(
        `https://api.chess.com/pub/club/${CLUB}/members`
      );

    let all = [
      ...club.weekly,
      ...club.monthly,
      ...club.all_time
    ];

    const seen = new Set();

    all =
      all.filter(member =>
        !seen.has(member.username)
        && seen.add(member.username)
      );

    all.sort((a,b) =>
      b.joined - a.joined
    );

    const top = all.slice(0,3);

    const users =
      await Promise.all(

        top.map(async member => {

          try{

            const [
              profile,
              stats,
              online
            ] = await Promise.all([

              fetchJSON(
                `https://api.chess.com/pub/player/${member.username}`
              ),

              fetchJSON(
                `https://api.chess.com/pub/player/${member.username}/stats`
              ),

              fetchJSON(
                `https://api.chess.com/pub/player/${member.username}/is-online`
              )
            ]);

            return {
              u:member.username,
              a:profile.avatar,
              r:getBest(stats),
              on:online.online,
              j:member.joined
            };

          }catch{

            return {
              u:member.username,
              a:"",
              r:"Unrated",
              on:false,
              j:member.joined
            };
          }
        })
      );

    const current =
      users.map(x => x.u).join(",");

    const previous =
      prevUsers.join(",");

    if(current !== previous){

      prevUsers =
        users.map(x => x.u);

      document.getElementById("members").innerHTML =
        users.map(
          (user, i) =>
            memberCard(user, i * 0.08)
        ).join("");
    }

  }catch(err){

    console.error(
      "Widget load failed:",
      err
    );
  }
}

load();

setInterval(load, 20000);
</script>
